name: Qualidade — testes e acessibilidade
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    name: Frontend — tipos, lint, build, acessibilidade e smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar ferramentas de teste
        run: npm install --no-save @playwright/test @axe-core/playwright
      - name: Verificar tipos
        run: npm run typecheck
      - name: Executar lint
        run: npm run lint
      - name: Gerar build
        run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Executar testes E2E, acessibilidade e API
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.POC_BASE_URL }}
  backend:
    name: Backend — build .NET 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/MiauNitorado.API/MiauNitorado.API.csproj
      - run: dotnet build backend/MiauNitorado.API/MiauNitorado.API.csproj --configuration Release --no-restore